name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kithlink
          POSTGRES_PASSWORD: kithlink_dev
          POSTGRES_DB: kithlink
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kithlink -d kithlink"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://kithlink_app:kithlink_app_dev@localhost:5432/kithlink
      TEST_DATABASE_URL: postgres://kithlink_app:kithlink_app_dev@localhost:5432/kithlink
      DATABASE_OWNER_URL: postgres://kithlink:kithlink_dev@localhost:5432/kithlink
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: kithlink-ci
      S3_ACCESS_KEY_ID: kithlink
      S3_SECRET_ACCESS_KEY: kithlink_ci_minio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.20.0 --activate
      - name: Install
        run: pnpm install --frozen-lockfile=false
      - name: Build, typecheck, lint
        run: pnpm turbo build typecheck lint
      - name: Provision DB roles (compose initdb)
        run: |
          PGPASSWORD=kithlink_dev psql -h localhost -U kithlink -d kithlink \
            -f deploy/compose/initdb/01-roles.sql \
            -f deploy/compose/initdb/02-extensions.sql
      - name: Generate master key
        run: echo "KITHLINK_MASTER_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - name: Migrate
        run: pnpm db:migrate
      - name: Start MinIO
        run: |
          curl -fsSL -o /tmp/minio https://dl.min.io/server/minio/release/linux-amd64/minio
          chmod +x /tmp/minio
          MINIO_ROOT_USER=kithlink MINIO_ROOT_PASSWORD=kithlink_ci_minio \
            nohup /tmp/minio server /tmp/minio-data --address :9000 > /tmp/minio.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 1
          done
      - name: Create MinIO bucket (retry until ready)
        run: |
          ok=0
          for i in $(seq 1 30); do
            if pnpm --filter @kithlink/server exec tsx scripts/create-bucket.ts; then ok=1; break; fi
            sleep 2
          done
          [ "$ok" = 1 ]
      - name: Unit + integration tests
        run: pnpm --filter '!@kithlink/e2e' test

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kithlink
          POSTGRES_PASSWORD: kithlink_dev
          POSTGRES_DB: kithlink
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kithlink -d kithlink"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://kithlink_app:kithlink_app_dev@localhost:5432/kithlink
      DATABASE_URL: postgres://kithlink_app:kithlink_app_dev@localhost:5432/kithlink
      DATABASE_OWNER_URL: postgres://kithlink:kithlink_dev@localhost:5432/kithlink
      REDIS_URL: redis://localhost:6379
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: kithlink-ci
      S3_ACCESS_KEY_ID: kithlink
      S3_SECRET_ACCESS_KEY: kithlink_ci_minio
      APP_URL: http://127.0.0.1:3000
      ADMIN_URL: http://127.0.0.1:3001
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.20.0 --activate

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Provision DB roles (compose initdb)
        run: |
          PGPASSWORD=kithlink_dev psql -h localhost -U kithlink -d kithlink \
            -f deploy/compose/initdb/01-roles.sql \
            -f deploy/compose/initdb/02-extensions.sql

      - name: Generate master key
        run: echo "KITHLINK_MASTER_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Build workspace libraries + apps
        run: |
          pnpm turbo build --filter @kithlink/contracts \
            --filter @kithlink/db --filter @kithlink/sync-adapters \
            --filter @kithlink/server --filter '@kithlink/web' --filter '@kithlink/admin'

      - name: Migrate
        run: pnpm db:migrate

      - name: Seed demo data
        run: pnpm --filter @kithlink/server exec tsx scripts/seed.ts
        env:
          DATABASE_URL: postgres://kithlink_app:kithlink_app_dev@localhost:5432/kithlink

      - name: Start MinIO
        run: |
          curl -fsSL -o /tmp/minio https://dl.min.io/server/minio/release/linux-amd64/minio
          chmod +x /tmp/minio
          MINIO_ROOT_USER=kithlink MINIO_ROOT_PASSWORD=kithlink_ci_minio \
            nohup /tmp/minio server /tmp/minio-data --address :9000 > /tmp/minio.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 1
          done

      - name: Create MinIO bucket (retry until ready)
        run: |
          ok=0
          for i in $(seq 1 30); do
            if pnpm --filter @kithlink/server exec tsx scripts/create-bucket.ts; then ok=1; break; fi
            sleep 2
          done
          [ "$ok" = 1 ]

      - name: Install Playwright browsers
        run: pnpm --filter @kithlink/e2e exec playwright install --with-deps chromium

      - name: Start API server
        run: |
          cd apps/server
          nohup node dist/main.api.js > /tmp/api-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4000/healthz && break
            sleep 1
          done

      - name: Start web server
        run: |
          cd apps/web
          nohup npx next start -p 3000 > /tmp/web-server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3000 > /dev/null && break
            sleep 2
          done

      - name: Start admin server
        run: |
          cd apps/admin
          nohup npx next start -p 3001 > /tmp/admin-server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3001 > /dev/null && break
            sleep 2
          done

      - name: Verify servers are running
        run: |
          echo "--- API health ---"
          curl -sf http://127.0.0.1:4000/healthz || echo "API NOT RESPONDING"
          echo "--- Web root ---"
          curl -sf -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/ || echo "WEB NOT RESPONDING"
          echo ""
          echo "--- API server log (last 20 lines) ---"
          tail -20 /tmp/api-server.log 2>/dev/null || echo "no log"
          echo "--- Web server log (last 20 lines) ---"
          tail -20 /tmp/web-server.log 2>/dev/null || echo "no log"

      - name: Run e2e tests (no webServer config — servers already running)
        run: pnpm --filter @kithlink/e2e exec playwright test
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
          E2E_ADMIN_URL: http://127.0.0.1:3001
          E2E_API_URL: http://127.0.0.1:4000
          TEST_DATABASE_URL: postgres://kithlink_app:kithlink_app_dev@localhost:5432/kithlink

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 7
