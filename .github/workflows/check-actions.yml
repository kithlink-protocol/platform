name: check-actions
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  update-actions:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Update action references
        run: |
          find .github/workflows -name '*.yml' -o -name '*.yaml' | while read f; do
            sed -i 's|actions/checkout@v[0-9]*|actions/checkout@v4|g' "$f"
            sed -i 's|actions/setup-node@v[0-9]*|actions/setup-node@v4|g' "$f"
            sed -i 's|docker/setup-buildx-action@v[0-9]*|docker/setup-buildx-action@v3|g' "$f"
            sed -i 's|docker/login-action@v[0-9]*|docker/login-action@v3|g' "$f"
            sed -i 's|docker/metadata-action@v[0-9]*|docker/metadata-action@v5|g' "$f"
            sed -i 's|docker/build-push-action@v[0-9]*|docker/build-push-action@v6|g' "$f"
          done

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create PR with updates
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "action-updater"
          git config user.email "action-updater@kithlink.org"
          git checkout -b chore/update-actions
          git add .github/workflows/
          git commit -m "chore(ci): bump GitHub Actions to latest versions"
          git push origin chore/update-actions
          gh pr create \
            --title "chore(ci): update GitHub Actions versions" \
            --body "Automated PR updating pinned action versions." \
            --base main --head chore/update-actions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
