name: gh-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.20.0 --activate
      - name: Install
        run: pnpm install --frozen-lockfile=false
      - name: Build contracts
        run: pnpm --filter @kithlink/contracts build
      - name: Build web (static export)
        run: pnpm --filter @kithlink/web build
        env:
          NEXT_OUTPUT_MODE: export
          API_URL: https://api.kithlink.org
          NEXT_PUBLIC_API_URL: https://api.kithlink.org
      - name: Add .nojekyll
        run: touch apps/web/out/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
